<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Paperboy cover sample</title>
<style>
html, body { margin: 0; padding: 0; }
body { font-family: "Source Serif 4", serif; }
.cover { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10% 8%; background: #f5efe4; }
.kicker { color: #a03020; font-size: 0.8em; font-weight: bold; letter-spacing: 0.4em; text-transform: uppercase; margin: 0 0 2em; }
.title { color: #1a1a1a; font-size: 3.2em; font-weight: bold; line-height: 1.3; margin: 0 0 0.4em; }
.rule { width: 5em; height: 2px; background: #a03020; border: none; margin: 0.8em auto 1em; }
.author { color: #4a4a4a; font-size: 1.3em; font-style: italic; }
hr { border: 0; border-bottom: 1px solid #dedede; margin: 3em 10%; }
</style>
</head>
<body>
<div class="cover">
  <p class="kicker">PAPERBOY</p>
  <h1 class="title">The Quick Brown Fox Jumps Over the Lazy Dog</h1>
  <div class="rule"></div>
  <p class="author">by Claude</p>
</div>
</body>
</html>
